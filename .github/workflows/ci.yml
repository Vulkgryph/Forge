# Runs the tests that guard the agent, the search engine and the two
# protocol/UI crates on every push and pull request.
#
# The Windows job gates, for everything it covers. It does not cover the
# editor; see the job for what that means.
#
# forge-ide is built and tested on macOS only, and not on Linux. That is the same
# reason `default-members` in the workspace root excludes it: it pulls in a GPU
# stack that a headless runner may not have. Its logic tests do not open a window,
# but its dependencies still have to compile, so it gets the runner that matches
# what it is actually shipped on.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A warning in this codebase is treated as a defect; the crates are kept at
  # zero and CI should say so rather than let one drift in unnoticed.
  RUSTFLAGS: -D warnings

jobs:
  linux-installer:
    name: Linux installer packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer validation tools
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils shellcheck
      - name: Shell and packaging checks
        run: |
          shellcheck install.sh scripts/test_linux_installer.sh
          bash scripts/test_linux_installer.sh

  agent:
    name: agent, protocol and terminal UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p forge-agent -p forge-agent-proto -p forge-search -p forge-tui-rs --verbose

      - name: Test
        run: cargo test -p forge-agent -p forge-agent-proto -p forge-search -p forge-tui-rs --verbose

  # Windows: the agent, the protocol, search, and the terminal client.
  #
  # This was informational and `continue-on-error`, from when Windows was not
  # a supported platform. It is now, and the comment saying otherwise outlived
  # the fact. Everything below builds and passes here, so it gates.
  #
  # The argument for gating is what happened while it did not. The job went red
  # twice, both times for a real defect — the headless loop discarding a
  # message that arrived while the agent was talking — and because the job
  # could not fail the build, nothing was blocked and it was found only because
  # someone went looking. A measurement nobody is obliged to read is not a
  # check.
  #
  # What this does NOT cover: forge-ide. The editor runs on Windows and is
  # installed by install.ps1, but its GPU stack and native dependencies
  # (libz-sys, openssl-sys via git2 and russh) are not built on this runner, so
  # a Windows regression in the editor will not be caught here. That gap is
  # real and is the next thing to close; it is not an argument for ungating the
  # parts that are covered.
  windows-probe:
    name: Windows (agent, protocol, search, terminal client)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Local installer failure and reinstall checks
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test_windows_installer.ps1

      - name: Build the portable crates
        run: cargo build --locked -p forge-agent-proto -p forge-search -p forge-tui-rs --verbose

      - name: Test them
        run: cargo test --locked -p forge-agent-proto -p forge-search -p forge-tui-rs --verbose

      - name: Agent
        run: cargo build -p forge-agent --verbose
      # The provider fault matrix is black-box: it spawns the agent against a
      # loopback fixture, so it says whether failure handling behaves the same
      # on Windows without anyone reproducing an outage by hand.
      - name: Agent failure matrix
        run: cargo test -p forge-agent --test resilience --verbose

  ide:
    name: editor (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p forge-ide -p forge-proto -p forge-server --verbose

      - name: Test
        run: cargo test -p forge-ide -p forge-proto -p forge-server --verbose

  packaging:
    name: the installer and the app bundle still work
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Shell syntax only — running the installer would write into the runner's
      # home directory and fetch a toolchain. Catches the class of mistake that
      # breaks `install.sh` for everyone while every test still passes.
      # A home directory in the documentation is somebody's username published
      # on a public repository, and an instruction that works on exactly one
      # machine. `%USERPROFILE%`, `$HOME` or a relative path is always what was
      # meant.
      #
      # Prose and scripts, not source: tests use paths like /home/sysadmin and
      # /Users/someone as deliberate placeholders, and a check that shouted
      # about those would be switched off inside a week. Platform docs and
      # installers are where this actually happens, because they get written by
      # running real commands on a real machine.
      - name: No home directories in the documentation
        run: |
          if git grep -nIE 'C:\\Users\\|/Users/[A-Za-z]|/home/[A-Za-z]' -- '*.md' '*.ps1' '*.sh' '*.cmd'; then
            echo "::error::a home directory is published above; use %USERPROFILE%, \$HOME or a relative path"
            exit 1
          fi

      - name: Installer parses
        run: bash -n forge-agent/install.sh && bash -n forge-agent/update.sh

      - name: Package the app bundle
        run: bash forge-ide/scripts/package_macos.sh

      - name: The bundle contains what it claims to
        run: |
          app="target/dist/Forge IDE.app"
          test -x "$app/Contents/MacOS/forge-ide"   || { echo "no editor binary"; exit 1; }
          test -x "$app/Contents/MacOS/forge-agent" || { echo "no agent binary"; exit 1; }
          test -f "$app/Contents/Info.plist"        || { echo "no Info.plist";  exit 1; }
