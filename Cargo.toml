[workspace]
members = ["forge-agent", "forge-agent-proto", "forge-ide", "forge-ide/forge-proto", "forge-ide/forge-server", "forge-search", "forge-tui-rs"]
# Without this, a plain `cargo build`/`cargo test` run from the workspace
# root builds every member by default — including forge-ide, which pulls in a
# GPU stack (wgpu and its backends) and needs a graphics-capable toolchain
# that a server, CI runner, or older machine may not have. forge-agent has no such requirement, so
# it's the safe default; `cargo build -p forge-ide` or `--workspace` still
# builds everything else explicitly.
default-members = ["forge-agent"]
resolver = "2"

# Local patch: winit's macOS drag-and-drop only checks the legacy
# `NSFilenamesPboardType` pasteboard format and rejects the drop outright if
# it's absent. Newer macOS system UI (the floating thumbnail shown after a
# Cmd+Shift+4 screenshot, notably) only offers `NSPasteboardTypeFileURL`,
# which the upstream implementation never checked at all. Vendored +
# patched in forge-ide/vendor/winit-0.30.13 to fall back to that modern
# type — see that crate's window_delegate.rs for the actual fix.
[patch.crates-io]
winit = { path = "forge-ide/vendor/winit-0.30.13" }

# lto/strip apply cleanly across the whole workspace (`lto` in particular
# can't be scoped per-package — it's a whole-binary-graph setting). Only
# opt-level differs: forge-server is uploaded over SFTP to remote SSH hosts
# on every connect (see forge-ide/src/ssh.rs), so it alone optimizes for
# size instead of speed.
[profile.release]
strip = true
lto   = true
# `strip = true` above is not enough to keep the build machine out of the
# binary: every `panic!`, `unwrap`, and `expect` bakes its source location into
# .rodata as a string literal for `core::panic::Location` to point at, which is
# program data rather than debug info, so stripping leaves it untouched. Built
# from a checkout under a home directory, the result ships the absolute path of
# every dependency file that can panic.
#
# The profile key for this (`trim-paths`) is still unstable as of Cargo 1.97, so
# the remapping is applied as rustflags by forge-ide/scripts/package_macos.sh,
# which is what builds anything we publish. It is deliberately not set here or
# in .cargo/config.toml: rustflags cannot be scoped to a profile, and remapping
# debug builds too would stop a debugger finding dependency sources. If
# `trim-paths` stabilizes, it belongs here and the script's flags can go.

[profile.release.package.forge-server]
opt-level = "z"
