[package]
name        = "forge-ide"
version     = "0.1.0"
edition     = "2024"
license     = "Apache-2.0"
description = "A fast, Rust/Vulkan-based code editor with built-in Git, LSP, and SSH remote development"
repository  = "https://github.com/Vulkgryph/Forge"

[[bin]]
name = "forge-ide"
path = "src/main.rs"

[features]
# Default renderer is wgpu (gfx_wgpu.rs): native Metal on macOS, D3D12 on
# Windows, Vulkan on Linux. Chosen over the hand-written Vulkan backend because
# Vulkan does not exist on macOS — that path needs MoltenVK, a 10 MB
# third-party dylib redistributed inside the .app. Metal ships with the OS, so
# the default build now bundles no third-party runtime at all.
default = []

# Opt-in: the original hand-written Vulkan renderer (gfx.rs + egui_pass.rs).
# Kept while wgpu proves itself in real use. Requires MoltenVK to be present at
# runtime on macOS — it is no longer bundled — and pulls in shaderc at build
# time to compile the SPIR-V shaders.
vulkan-renderer = ["dep:ash", "dep:ash-window", "dep:shaderc"]

[dependencies]
forge-proto       = { path = "forge-proto" }
egui-wgpu         = { version = "0.29", default-features = false }
wgpu              = "22"
pollster          = "0.3"
ash               = { version = "0.38", optional = true }
ash-window        = { version = "0.13", optional = true }
winit             = "0.30"
egui              = "0.29.1"
egui-winit        = "0.29.1"
bytemuck          = { version = "1", features = ["derive"] }
raw-window-handle = "0.6"
portable-pty      = "0.8"
rfd               = "0.14"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
image             = { version = "0.25", default-features = false, features = ["png"] }
git2              = { version = "0.19", default-features = false, features = ["vendored-libgit2", "vendored-openssl", "ssh", "https"] }
russh             = { version = "0.61", features = ["rsa"] }
russh-sftp        = "2.3"
tokio             = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
dirs              = "5"
toml              = "0.8"
libloading        = "0.8"
notify = "6"
# Update-checker only — one blocking GET to the GitHub Releases API on
# startup, in a background thread. rustls (not native-tls) so it doesn't
# reintroduce the dynamic-OpenSSL distribution problem git2 had.
ureq              = { version = "2", default-features = false, features = ["json", "tls"] }

# macOS Dock-icon context menu (src/dock_menu.rs). Versions pinned to match the
# vendored winit so there is one objc2 in the graph, not two.
[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.5.2"
features = ["relax-sign-encoding"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.2.2"
features = ["NSApplication", "NSMenu", "NSMenuItem", "NSResponder"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.2.2"
features = ["NSString", "NSThread"]

[build-dependencies]
shaderc = { version = "0.10", optional = true }
toml    = "0.8"

# winit patch (vendor/winit-0.30.13) is declared in the workspace root
# Cargo.toml — [patch] tables in a member manifest are ignored once that
# member is part of a larger workspace.
