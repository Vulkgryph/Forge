[package]
name        = "forge-ide"
version     = "0.6.1"
edition     = "2024"
license     = "Apache-2.0"
description = "A fast, native Rust code editor with built-in Git, LSP, and SSH remote development"
repository  = "https://github.com/Vulkgryph/Forge"

[[bin]]
name = "forge-ide"
path = "src/main.rs"

[features]
# The renderer is wgpu (gfx_wgpu.rs), which selects the platform's own API:
# Metal on macOS, D3D12 on Windows, Vulkan on Linux.
#
# There used to be a second, hand-written Vulkan backend behind a
# `vulkan-renderer` feature. It is gone. Vulkan does not exist on macOS, so
# that path needed MoltenVK — a third-party dylib this repository does not
# redistribute — and it was never built in CI, so it was 1,421 lines that
# nothing compiled and nobody ran. wgpu had already shipped a notarized macOS
# release and drawn frames on Windows D3D12 by the time it was removed, which
# is the bar its comment said it was waiting on.
default = []


[dependencies]
forge-proto       = { path = "forge-proto" }
egui-wgpu         = { version = "0.29", default-features = false }
wgpu              = "22"
pollster          = "0.3"
winit             = "0.30"
egui              = "0.29.1"
egui-winit        = "0.29.1"
bytemuck          = { version = "1", features = ["derive"] }
raw-window-handle = "0.6"
portable-pty      = "0.8"
rfd               = "0.14"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
git2              = { version = "0.20", default-features = false, features = ["vendored-libgit2", "vendored-openssl", "ssh", "https"] }
russh             = { version = "0.63", features = ["rsa"] }
russh-sftp        = "2.4"
tokio             = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
dirs              = "5"
toml              = "0.8"
libloading        = "0.8"
notify = "6"
# Update-checker only — one blocking GET to the GitHub Releases API on
# startup, in a background thread. rustls (not native-tls) so it doesn't
# reintroduce the dynamic-OpenSSL distribution problem git2 had.
ureq              = { version = "2", default-features = false, features = ["json", "tls"] }

# macOS Dock-icon context menu (src/dock_menu.rs). Versions pinned to match the
# vendored winit so there is one objc2 in the graph, not two.
[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.5.2"
features = ["relax-sign-encoding"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.2.2"
# NSView is for src/webview.rs, which parents a WKWebView onto the window's
# content view. No new crate for WebKit itself — the class is looked up at
# runtime and the framework linked directly, which keeps the objc2 in the
# graph singular and adds nothing to the dependency count.
features = ["NSApplication", "NSMenu", "NSMenuItem", "NSResponder", "NSView", "NSWindow"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.2.2"
features = ["NSString", "NSThread", "NSURL", "NSURLRequest", "NSGeometry", "NSDictionary", "NSValue"]

[build-dependencies]
toml    = "0.8"

# winit patch (vendor/winit-0.30.13) is declared in the workspace root
# Cargo.toml — [patch] tables in a member manifest are ignored once that
# member is part of a larger workspace.
