[package]
name        = "forge-ide"
version     = "0.1.0"
edition     = "2024"
license     = "Apache-2.0"
description = "A fast, Rust/Vulkan-based code editor with built-in Git, LSP, and SSH remote development"
repository  = "https://github.com/Vulkgryph/Forge"

[[bin]]
name = "forge-ide"
path = "src/main.rs"

[dependencies]
forge-proto       = { path = "forge-proto" }
ash               = "0.38"
ash-window        = "0.13"
winit             = "0.30"
egui              = "0.29.1"
egui-winit        = "0.29.1"
bytemuck          = { version = "1", features = ["derive"] }
raw-window-handle = "0.6"
portable-pty      = "0.8"
rfd               = "0.14"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
image             = { version = "0.25", default-features = false, features = ["png"] }
git2              = { version = "0.19", default-features = false, features = ["vendored-libgit2", "vendored-openssl", "ssh", "https"] }
russh             = { version = "0.61", features = ["rsa"] }
russh-sftp        = "2.3"
tokio             = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
dirs              = "5"
toml              = "0.8"
libloading        = "0.8"
notify = "6"
# Update-checker only — one blocking GET to the GitHub Releases API on
# startup, in a background thread. rustls (not native-tls) so it doesn't
# reintroduce the dynamic-OpenSSL distribution problem git2 had.
ureq              = { version = "2", default-features = false, features = ["json", "tls"] }

[build-dependencies]
shaderc = "0.10"
toml    = "0.8"

# winit patch (vendor/winit-0.30.13) is declared in the workspace root
# Cargo.toml — [patch] tables in a member manifest are ignored once that
# member is part of a larger workspace.
