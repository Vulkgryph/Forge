[package]
name    = "forge-server"
version = "0.1.7"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "forge-server"
path = "src/main.rs"

[dependencies]
forge-proto  = { path = "../forge-proto" }
serde_json   = "1"
portable-pty = "0.8"
libc         = { version = "0.2", optional = false }

# Release profile (strip/opt-level/lto) now lives in the workspace root
# Cargo.toml as a per-package override — profile tables in a member
# manifest are ignored once it's part of a larger workspace.
