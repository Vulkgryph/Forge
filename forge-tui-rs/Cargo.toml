[package]
name    = "forge-tui-rs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Terminal UI for the Forge agent, rendered from scratch."

# No terminal library, and no libc: raw mode, window size, signals and input
# decoding are in `sys.rs` and `keys.rs`, which declare the handful of C
# functions they need directly. The two unicode crates are the remaining
# exceptions, carrying the character tables.
[dependencies]
forge-agent-proto    = { path = "../forge-agent-proto" }
unicode-segmentation = "1.12"
unicode-width        = "0.2"
